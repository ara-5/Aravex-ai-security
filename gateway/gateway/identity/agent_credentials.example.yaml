# Documentation only -- NOT loaded by the gateway.
#
# The real gateway/identity/agent_credentials.yaml is generated locally by
# `python scripts/generate_agent_keys.py` and is gitignored: it holds a
# SHA-256 hash per agent, never the plaintext key. This file just shows the
# shape so you know what to expect.
agents:
  customer-support-agent: "<sha256 hex digest of that agent's bearer key>"
  data-ops-agent: "<sha256 hex digest of that agent's bearer key>"
  billing-agent: "<sha256 hex digest of that agent's bearer key>"
