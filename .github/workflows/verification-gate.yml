name: Verification Gate

# Fails a change if an approved gateway rule stops keeping its finding blocked,
# if the rule behaves differently under OPA than under the local matcher, if it
# starts blocking benign work, or if the gate itself can no longer fail.
on:
  push:
    branches: [main]
    paths: ['policies/**', 'gateway/**', 'redteam/**', 'loop/**', 'schemas/**', 'tests/gate/**', '.github/**']
  pull_request:
    paths: ['policies/**', 'gateway/**', 'redteam/**', 'loop/**', 'schemas/**', 'tests/gate/**', '.github/**']

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            redteam/requirements.txt
            gateway/requirements.txt

      - name: Install dependencies
        run: pip install -r redteam/requirements.txt -r gateway/requirements.txt

      - name: Validate Rego (opa test)
        run: docker run --rm -v "${{ github.workspace }}/gateway/gateway/policy/rego:/policy" openpolicyagent/opa test /policy -v

      - name: Start OPA server
        run: |
          docker run -d --name opa -p 8181:8181 \
            -v "${{ github.workspace }}/gateway/gateway/policy/rego:/policy" \
            openpolicyagent/opa run --server --addr 0.0.0.0:8181 /policy
          for i in $(seq 1 20); do
            curl -sf http://localhost:8181/health && break
            sleep 1
          done
          curl -sf http://localhost:8181/health

      - name: Rego/YAML parity for generated rules
        working-directory: gateway
        env:
          OPA_URL: http://localhost:8181
          REQUIRE_OPA: "1"
        run: pytest tests/test_rego_export.py -q

      - name: Verification gate (YAML and OPA backends)
        env:
          OPA_URL: http://localhost:8181
          REQUIRE_OPA: "1"
        run: pytest tests/gate -v
