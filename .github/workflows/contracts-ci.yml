name: Contracts CI

on:
  push:
    branches: [main]
    paths: ['schemas/**', 'loop/**', 'tests/**', 'gateway/gateway/**', 'redteam/redteam_engine/attacks/**', '.github/**']
  pull_request:
    paths: ['schemas/**', 'loop/**', 'tests/**', 'gateway/gateway/**', 'redteam/redteam_engine/attacks/**', '.github/**']

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r gateway/requirements.txt
      - name: Contract and loop tests (schemas, gateway/red-team compatibility, rule synthesis)
        run: pytest -q
