name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Grafana dashboard JSON
        run: python -c "import json; json.load(open('grafana/dashboards/aegisai-overview.json')); print('valid')"

      - name: Mint dev agent credentials (smoke test)
        run: python scripts/generate_agent_keys.py

      - name: Run tests
        run: pytest -q
