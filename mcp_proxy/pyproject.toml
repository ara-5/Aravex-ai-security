[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aravex-mcp"
version = "0.1.0"
description = "Puts the Aravex zero-trust gateway in front of any stdio MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary. Copyright (c) 2026 ara-5. All rights reserved." }
dependencies = [
    "mcp>=1.12,<2",
    "httpx>=0.27",
    "pyyaml>=6.0",
]
classifiers = [
    # Stops `twine upload` from publishing this to PyPI by accident.
    "Private :: Do Not Upload",
    "License :: Other/Proprietary License",
]

[project.scripts]
aravex-mcp = "aravex_mcp.__main__:main"

[tool.setuptools]
packages = ["aravex_mcp"]
